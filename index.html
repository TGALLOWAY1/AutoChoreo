<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoChoreo</title>
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(135deg, #0a0a1a 0%, #0d0d1f 30%, #0a0a15 70%, #050510 100%);
            color: #ffffff;
        }

        /* ── Top bar ─────────────────────────────────────────── */

        #uiBar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0 12px;
            z-index: 1000;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            pointer-events: none;
            overflow-x: auto;
            overflow-y: hidden;
        }

        .app-title {
            font-size: 14px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.7);
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        .separator {
            width: 1px;
            height: 28px;
            background: rgba(255, 255, 255, 0.15);
            flex-shrink: 0;
        }

        /* ── Buttons & inputs in bar ─────────────────────────── */

        .bar-btn {
            padding: 8px 10px;
            font-size: 13px;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            color: #ffffff;
            cursor: pointer;
            transition: all 0.2s ease;
            pointer-events: auto;
            white-space: nowrap;
        }

        .bar-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .bar-btn:active {
            transform: scale(0.98);
        }

        .bar-select {
            padding: 7px 10px;
            font-size: 13px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            color: #ffffff;
            cursor: pointer;
            pointer-events: auto;
            max-width: 180px;
        }

        .bar-select option {
            background: #1a1a2e;
            color: #ffffff;
        }

        /* ── Slider groups ───────────────────────────────────── */

        .slider-group {
            display: flex;
            align-items: center;
            gap: 8px;
            pointer-events: auto;
        }

        .slider-group label {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.7);
            white-space: nowrap;
        }

        .slider-group input[type="range"] {
            width: 72px;
            height: 6px;
            border-radius: 3px;
            background: rgba(255, 255, 255, 0.2);
            outline: none;
            -webkit-appearance: none;
            appearance: none;
        }

        .slider-group input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
        }

        .slider-group input[type="range"]::-moz-range-thumb {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
            border: none;
        }

        .slider-group .value-label {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.9);
            min-width: 35px;
            text-align: right;
        }

        /* ── Track name / status ─────────────────────────────── */

        #trackName {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 200px;
            margin-left: auto;
        }

        /* ── Hidden file inputs ──────────────────────────────── */

        .hidden-input {
            display: none;
        }

        /* ── Bottom timeline bar ─────────────────────────────── */

        #timelineBar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 48px;
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 20px;
            z-index: 1000;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        #timeDisplay {
            font-size: 12px;
            font-family: 'SF Mono', 'Menlo', 'Monaco', monospace;
            color: rgba(255, 255, 255, 0.7);
            min-width: 100px;
            text-align: center;
            user-select: none;
        }

        #scrubber {
            flex: 1;
            height: 6px;
            border-radius: 3px;
            background: rgba(255, 255, 255, 0.15);
            outline: none;
            -webkit-appearance: none;
            appearance: none;
            cursor: pointer;
        }

        #scrubber::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #00d9ff;
            cursor: pointer;
            transition: transform 0.1s ease;
        }

        #scrubber::-webkit-slider-thumb:hover {
            transform: scale(1.3);
        }

        #scrubber::-moz-range-thumb {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #00d9ff;
            cursor: pointer;
            border: none;
        }

        /* ── Bones toggle ───────────────────────────────────── */

        .bones-toggle {
            display: flex;
            align-items: center;
            gap: 6px;
            pointer-events: auto;
            cursor: pointer;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.7);
            white-space: nowrap;
            user-select: none;
        }

        .bones-toggle input[type="checkbox"] {
            accent-color: #00d9ff;
            width: 14px;
            height: 14px;
            cursor: pointer;
        }

        /* ── Loading overlay ────────────────────────────────── */

        #loadingOverlay {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(0, 217, 255, 0.3);
            border-radius: 12px;
            padding: 20px 32px;
            color: #00d9ff;
            font-size: 14px;
            z-index: 2000;
        }

        #loadingOverlay {
            max-width: min(480px, 80vw);
            text-align: center;
            line-height: 1.4;
        }

        /* ── Reference video panel ──────────────────────────── */

        #videoPanel {
            display: none;
            position: fixed;
            left: 16px;
            bottom: 64px;
            width: min(260px, 32vw);
            border: 1px solid rgba(0, 217, 255, 0.3);
            border-radius: 8px;
            overflow: hidden;
            background: #000;
            z-index: 900;
            line-height: 0;
        }

        #videoPanel video {
            width: 100%;
            height: auto;
            max-height: 50vh;
            object-fit: contain;
        }

        #videoPanel canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none;
        }

        #videoPanel .panel-label {
            position: absolute;
            top: 6px;
            left: 8px;
            font-size: 10px;
            line-height: 1;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.75);
            text-shadow: 0 0 4px #000;
        }

        /* ── Sequence editor panel ───────────────────────────── */

        #sequencePanel {
            display: none;
            position: fixed;
            top: 68px;
            right: 8px;
            bottom: 96px;
            width: min(360px, calc(100vw - 16px));
            overflow-y: auto;
            background: rgba(10, 10, 26, 0.88);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 10px;
            padding: 10px 12px 12px;
            z-index: 1100;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.85);
        }

        #sequencePanel.open { display: block; }

        #sequencePanel section {
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding: 8px 0 6px;
        }

        #sequencePanel h3 {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.6px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 6px;
        }

        .seq-head, .seq-foot, .seq-row, .seq-clip-head {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
        }

        .seq-head { padding-bottom: 8px; }
        .seq-foot { border-top: 1px solid rgba(255, 255, 255, 0.08); padding-top: 8px; }
        .seq-row { margin: 4px 0; }
        .seq-spacer { flex: 1; }

        .seq-title {
            flex: 1;
            min-width: 0;
            font-size: 14px;
            font-weight: 600;
            background: transparent;
            border: 1px solid transparent;
            border-radius: 5px;
            color: #fff;
            padding: 3px 5px;
        }

        .seq-title:hover, .seq-title:focus { border-color: rgba(255, 255, 255, 0.2); outline: none; }

        #sequencePanel label {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
        }

        #sequencePanel input[type="number"] {
            width: 58px;
            padding: 3px 4px;
            font-size: 12px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 4px;
            color: #fff;
        }

        .seq-select {
            padding: 3px 4px;
            font-size: 12px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 4px;
            color: #fff;
            max-width: 100%;
        }

        .seq-select option { background: #1a1a2e; color: #fff; }
        .seq-select:disabled { opacity: 0.4; }

        .seq-btn {
            padding: 4px 8px;
            font-size: 12px;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 5px;
            color: #fff;
            cursor: pointer;
            white-space: nowrap;
        }

        .seq-btn:hover:not(:disabled) { background: rgba(255, 255, 255, 0.2); }
        .seq-btn:disabled { opacity: 0.35; cursor: default; }
        .seq-btn.primary { background: rgba(0, 217, 255, 0.25); border-color: rgba(0, 217, 255, 0.6); }
        .seq-btn.icon { padding: 2px 6px; font-weight: 400; }
        .seq-btn.small { padding: 2px 6px; font-size: 11px; }

        .seq-check { white-space: normal !important; margin-bottom: 4px; }
        .seq-hint { color: rgba(255, 255, 255, 0.45); font-size: 11px; line-height: 1.35; margin: 4px 0; }
        .seq-info { color: rgba(255, 255, 255, 0.55); font-size: 11px; }
        .seq-info.warn { color: #ffb347; }

        .seq-clip {
            border-left: 3px solid hsl(var(--hue), 70%, 50%);
            background: rgba(255, 255, 255, 0.04);
            border-radius: 6px;
            padding: 6px 8px;
            margin-top: 6px;
        }

        .seq-num {
            font-weight: 700;
            color: hsl(var(--hue), 80%, 65%);
        }

        .seq-name {
            flex: 1;
            min-width: 0;
            font-weight: 600;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .seq-join, .seq-speed {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
            margin: 4px 0 0 10px;
            padding: 5px 8px;
            border: 1px dashed rgba(255, 255, 255, 0.18);
            border-radius: 6px;
        }

        .seq-join.loop { margin-left: 0; }
        .seq-speed { display: block; margin: 0 0 6px; border-style: solid; border-color: rgba(255, 170, 60, 0.35); }
        .seq-join-label { width: 100%; color: rgba(255, 255, 255, 0.55); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        @keyframes seq-flash {
            from { background: rgba(0, 217, 255, 0.35); }
            to { background: transparent; }
        }
        .flash { animation: seq-flash 1.2s ease-out; }

        /* ── Sequence timeline strip (above the scrubber) ─────── */

        #sequenceStrip {
            display: none;
            position: fixed;
            bottom: 50px;
            height: 40px;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.35);
            border-radius: 4px;
        }

        /* ── Canvas ──────────────────────────────────────────── */

        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <!-- Hidden file inputs -->
    <input type="file" id="audioFileInput" class="hidden-input" accept="audio/*">
    <input type="file" id="fbxFileInput" class="hidden-input" accept=".fbx,.json,video/*">
    <input type="file" id="glbFileInput" class="hidden-input" accept=".glb,.gltf,.fbx">

    <!-- Top control bar -->
    <div id="uiBar">
        <div class="app-title">AutoChoreo</div>

        <div class="separator"></div>

        <button id="playPauseButton" class="bar-btn">Play</button>

        <div class="separator"></div>

        <div class="slider-group">
            <label for="speedSlider">Speed</label>
            <input type="range" id="speedSlider" min="0.25" max="2" step="0.05" value="1">
            <span class="value-label" id="speedValue">1.0x</span>
        </div>

        <div class="separator"></div>

        <div class="slider-group">
            <label for="distanceSlider">Dist</label>
            <input type="range" id="distanceSlider" min="1" max="10" step="0.1" value="5">
            <span class="value-label" id="distanceValue">50%</span>
        </div>

        <div class="separator"></div>

        <select id="fbxPresetSelect" class="bar-select">
            <option value="">-- Preset dances --</option>
            <option value="./TEST_DATA/DancingMedium_mixamo.fbx">Dancing Medium</option>
            <option value="./TEST_DATA/DancingwithDrink_mixamo.fbx">Dancing with Drink</option>
            <option value="./TEST_DATA/DoTheRobot_mixamo.fbx">Do The Robot</option>
            <option value="./TEST_DATA/DoTheTwist_mixamo.fbx">Do The Twist</option>
            <option value="./TEST_DATA/GentleSwayingDancing_mixamo.fbx">Gentle Swaying</option>
            <option value="./TEST_DATA/NPC_DancingParty_mixamo.fbx">NPC Dancing Party</option>
        </select>

        <div class="separator"></div>

        <select id="riggingSelect" class="bar-select">
            <option value="skeleton">Skeleton Only</option>
            <option value="default">Default Character</option>
            <option value="xbot">X-Bot (Mixamo)</option>
            <option value="custom">Load GLB...</option>
        </select>

        <div class="separator"></div>

        <button id="loadFbxButton" class="bar-btn" title="Load a dance: a mocap FBX, a video of a dancer, or a saved choreography (.json)">Load Dance</button>
        <button id="loadAudioButton" class="bar-btn">Load Audio</button>
        <button id="saveChoreoButton" class="bar-btn" title="Save the current dance as a character-independent choreography file">Save Choreo</button>
        <button id="sequenceButton" class="bar-btn" title="Stitch several dances together with smooth transitions and rhythmic speed changes">Sequence</button>

        <label class="bones-toggle">
            <input type="checkbox" id="skeletonToggle" checked>
            <span>Bones</span>
        </label>

        <span id="trackName"></span>
    </div>

    <!-- Bottom timeline / scrubber bar -->
    <div id="timelineBar">
        <span id="timeDisplay">0:00 / 0:00</span>
        <input type="range" id="scrubber" min="0" max="1" step="0.001" value="0">
    </div>

    <!-- Reference video (shown while the current dance was learned from a video) -->
    <div id="videoPanel">
        <video id="refVideo" muted playsinline></video>
        <canvas id="refOverlay"></canvas>
        <span class="panel-label">Reference</span>
    </div>

    <!-- Sequence editor (filled in by sequenceEditor.js) and its timeline strip -->
    <div id="sequencePanel"></div>
    <canvas id="sequenceStrip"></canvas>

    <!-- Loading overlay -->
    <div id="loadingOverlay">Loading rigging...</div>

    <script type="module" src="main.js"></script>
</body>
</html>
